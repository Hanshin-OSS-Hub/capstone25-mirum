name: CI_Backend

on:
  pull_request:
    branches:
      - 'main'
      - 'dev'
    paths:
      - 'backend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: # checkout PR's head ref
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Inject properties
        run: |
          mkdir -p src/main/resources
          echo "aws.s3.bucket=${{ secrets.AWS_S3_BUCKET }}" >> src/main/resources/application.properties
          echo "spring.jwt.secret=${{ secrets.JWT }}" >> src/main/resources/application.properties
          echo "gemini.api.url=${{ secrets.GEMINI_API_URL }}" >> src/main/resources/application.properties
          echo "gemini.api.key=${{ secrets.GEMINI_API_KEY }}" >> src/main/resources/application.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./backend/gradlew

      - name: Build Spring Boot application
        run: ./gradlew build -x test
        working-directory: ./backend

      # - name: Run tests
      #   run: ./gradlew test
      #   working-directory: ./backend

      # - name: Upload test results
      #   uses: actions/upload-artifact@v4
      #   if: always()
      #   with:
      #     name: test-results
      #     path: build/test-results/test/*.xml
      #     retention-days: 30

      - name: Commit Info
        id: commit_info
        if: always()
        run: |
          # PR의 헤드 커밋 정보를 가져옴
          echo "msg=$(git log -1 --pretty='%s')" >> $GITHUB_OUTPUT
          echo "author=${{ github.actor }}" >> $GITHUB_OUTPUT
          echo "pr_title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          echo "pr_number=${{ github.event.number }}" >> $GITHUB_OUTPUT
          echo "pr_url=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT
          
          # PR description을 멀티라인으로 안전하게 저장
          {
            echo "pr_description<<EOF"
            echo "${{ github.event.pull_request.body }}"
            echo "EOF"
          } >> $GITHUB_OUTPUT



