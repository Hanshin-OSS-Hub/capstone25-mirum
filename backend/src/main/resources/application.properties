spring.application.name=my-app

############################### for prod #################################

# AWS Cloud Setup (Guide Step 2)
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.credentials.instance-profile=true

# Secrets Manager Integration (Spring Cloud AWS 3.0+)
spring.config.import=aws-secretsmanager:db_password

# MySQL DB connection for production
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_ENDPOINT:localhost:3306}/mydatabase?useSSL=true&serverTimezone=Asia/Seoul
spring.datasource.username=admin
spring.datasource.password=${db_password}

# Frontend URL
frontend.url=https://mirum.duckdns.org

############################### for prod #################################



